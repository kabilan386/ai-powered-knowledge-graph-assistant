services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      HEALTHCHECK_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" -d neo4j 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
  backend:
    build: ./backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_DATABASE: neo4j
      NEO4J_CONNECTION_TIMEOUT: "${NEO4J_CONNECTION_TIMEOUT:-5}"
      NEO4J_HEALTH_TIMEOUT: "${NEO4J_HEALTH_TIMEOUT:-5}"
      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-10485760}"
      CHUNK_SIZE: "${CHUNK_SIZE:-1000}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-200}"
      MAX_EXTRACTED_CHARACTERS: "${MAX_EXTRACTED_CHARACTERS:-2000000}"
      MAX_DOCX_UNCOMPRESSED_BYTES: "${MAX_DOCX_UNCOMPRESSED_BYTES:-52428800}"
      MAX_CHUNKS: "${MAX_CHUNKS:-10000}"
      NEO4J_WRITE_TIMEOUT: "${NEO4J_WRITE_TIMEOUT:-30}"
      LLM_EXTRACTION_ENABLED: "${LLM_EXTRACTION_ENABLED:-false}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_REQUEST_TIMEOUT: "${LLM_REQUEST_TIMEOUT:-30}"
      LLM_MAX_ATTEMPTS: "${LLM_MAX_ATTEMPTS:-2}"
      LLM_RETRY_BACKOFF: "${LLM_RETRY_BACKOFF:-0.5}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-4096}"
      ENTITY_TYPES: '${ENTITY_TYPES:-["PERSON","ORGANIZATION","PROJECT","SERVICE","TECHNOLOGY","DATABASE","CLOUD_SERVICE","LOCATION","CONCEPT","OTHER"]}'
      RELATIONSHIP_TYPES: '${RELATIONSHIP_TYPES:-["WORKS_ON","USES","MANAGES","DEPENDS_ON","HOSTED_ON","PART_OF","BELONGS_TO","CREATED_BY","LOCATED_IN","RELATED_TO"]}'
      EMBEDDING_ENABLED: "${EMBEDDING_ENABLED:-false}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openai}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
      EMBEDDING_REQUEST_DIMENSIONS: "${EMBEDDING_REQUEST_DIMENSIONS:-true}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-32}"
      EMBEDDING_REQUEST_TIMEOUT: "${EMBEDDING_REQUEST_TIMEOUT:-30}"
      EMBEDDING_MAX_ATTEMPTS: "${EMBEDDING_MAX_ATTEMPTS:-2}"
      EMBEDDING_RETRY_BACKOFF: "${EMBEDDING_RETRY_BACKOFF:-0.5}"
      EMBEDDING_MAX_INPUT_CHARACTERS: "${EMBEDDING_MAX_INPUT_CHARACTERS:-24000}"
      VECTOR_MAX_TOP_K: "${VECTOR_MAX_TOP_K:-50}"
      VECTOR_INDEX_TIMEOUT: "${VECTOR_INDEX_TIMEOUT:-30}"
      GRAPH_RETRIEVAL_ENABLED: "${GRAPH_RETRIEVAL_ENABLED:-false}"
      GRAPH_MAX_HOPS: "${GRAPH_MAX_HOPS:-3}"
      GRAPH_MAX_ANCHORS: "${GRAPH_MAX_ANCHORS:-5}"
      GRAPH_FAN_OUT: "${GRAPH_FAN_OUT:-25}"
      GRAPH_MAX_CANDIDATES: "${GRAPH_MAX_CANDIDATES:-200}"
      GRAPH_MAX_RESULTS: "${GRAPH_MAX_RESULTS:-25}"
      GRAPH_MAX_EVIDENCE: "${GRAPH_MAX_EVIDENCE:-3}"
      GRAPH_RETRIEVAL_TIMEOUT: "${GRAPH_RETRIEVAL_TIMEOUT:-10}"
      GRAPHRAG_ENABLED: "${GRAPHRAG_ENABLED:-false}"
      VECTOR_TOP_K: "${VECTOR_TOP_K:-5}"
      MAX_GRAPH_PATHS: "${MAX_GRAPH_PATHS:-5}"
      MAX_CONTEXT_CHUNKS: "${MAX_CONTEXT_CHUNKS:-10}"
      MAX_CONTEXT_CHARACTERS: "${MAX_CONTEXT_CHARACTERS:-20000}"
      MAX_CHUNK_CONTEXT_CHARACTERS: "${MAX_CHUNK_CONTEXT_CHARACTERS:-4000}"
      GRAPHRAG_REQUEST_TIMEOUT: "${GRAPHRAG_REQUEST_TIMEOUT:-120}"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      APP_NAME: "${APP_NAME:-Knowledge Graph Assistant}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
        NEXT_PUBLIC_MAX_FILE_SIZE: "${MAX_FILE_SIZE:-10485760}"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/chat').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
volumes:
  neo4j_data:
